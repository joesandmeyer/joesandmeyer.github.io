<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Me</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <nav>
            <ul>
                <li><a href="./index.html">Home</a></li>
                <li><a href="./index.html#about">About</a></li>
                <li><a href="./index.html#games">Games</a></li>
                <li><a href="./index.html#wordpress">WordPress Sites</a></li>
            </ul>
        </nav>
    </header>

    <section id="contact">
        <h1>Contact Me</h1>
        
        Feel free to reach out to me for any inquiries!

        Email: joey.sandmeyer@gmail.com
        
        <br><br><br><br><br><br>
        
        <form id="contactForm">
            <!--
            <label for="name">Name:</label>
            <input type="text" id="name" name="name" required>
            <br><br>
            -->
            
            <label for="email">&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;Email:</label>
            <input type="email" id="email" name="email" style="width:380px;height:20px;" required>
            <br><br>
            
            <label for="message">Message:</label>
            <textarea id="message" name="message" style="width:480px;height:300px;" required></textarea>
            <br><br>
            
            <button type="submit">Send Message</button>
        </form>
    </section>

    <footer>
        <p>&copy; 2026 Joseph T. Sandmeyer. All rights reserved.</p>
    </footer>
    <script>
    document.getElementById("contactForm").addEventListener("submit", async function(e) {
        e.preventDefault();

        const formData = {
            email: document.getElementById("email").value,
            message: document.getElementById("message").value
        };

        try {
            const response = await fetch("https://formspree.io/f/mvzlvejg", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify(formData)
            });

            if (response.ok) {
                alert("Message sent!");
                document.getElementById("contactForm").reset();
            } else {
                alert("Something went wrong.");
            }
        } catch (error) {
            alert("Error sending message.");
            console.error(error);
        }
    });
    </script>
</body>
</html>
